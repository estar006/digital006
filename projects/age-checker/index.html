<!DOCTYPE html>
<html>

<body>
<p id="check"></p>
<input type="number" placeholder="your age">
<button onClick="ageCheck()">check</button>

<script>

function ageCheck() {
    let age = document.querySelector("input").value;
    if (age < 18) {
        document.getElementById("check").innerHTML = "you are a teenager";
    } else if (age >= 18) {
        document.getElementById("check").innerHTML = "you are an adult";
    } else {
        document.getElementById("check").innerHTML = "you are not a valid age";
    }
}

</script>
</body>
</html>
